[package]
name = "undertone"
version = "0.1.0"
description = "Lyrics on the desktop layer"
edition = "2021"

[lib]
name = "undertone_lib"

[[bin]]
name = "undertone"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:windows-sys", "dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
regex = "1"
unicode-normalization = "0.1"
sha1 = "0.10"
tempfile = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", optional = true, features = ["macos-private-api", "tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", optional = true, features = ["Foundation", "Media_Control", "Storage_Streams"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net"] }
