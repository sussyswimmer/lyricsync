[package]
name = "undertone"
version = "0.1.0"
description = "Lyrics on the desktop layer"
edition = "2021"

[lib]
name = "undertone_lib"

[[bin]]
name = "undertone"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-global-shortcut",
    "dep:windows-sys",
    "dep:windows",
    "dep:windows-registry",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-service-management",
    "dep:block2",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
regex = "1"
unicode-normalization = "0.1"
sha1 = "0.10"
tempfile = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", optional = true, features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = [
    "block2",
    "NSAppleEventDescriptor",
    "NSAppleScript",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSOperation",
    "NSString",
    "NSThread",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "block2",
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGWindowLevel"] }
# Launch at login: what System Settings does with the autostart plugin's LaunchAgent (login_item.rs).
objc2-service-management = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", optional = true, features = ["Foundation", "Media_Control", "Storage_Streams"] }
# Launch at login: the Run value the autostart plugin wrote, and Task Manager's state (login_item.rs).
windows-registry = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net"] }
