[package]
name = "undertone"
version = "0.1.0"
description = "Lyrics on the desktop layer"
edition = "2021"

[lib]
name = "undertone_lib"

[[bin]]
name = "undertone"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", optional = true, features = ["macos-private-api", "tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
